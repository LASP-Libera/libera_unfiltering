[project]
name = "unfiltered_radiances"
version = "0.2.0"
description = "Libera Unfiltered Radiance Product"
authors = [
    { name = "Caleb" },
    { name = "Heather Cronk" }
]
requires-python = ">=3.11,<4"
dependencies = [
    "libera-utils>=5.10.2,<6.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "matplotlib>=3.10.1",
    "seaborn",
    "scipy",
    "plotly",
    "cloudpathlib[s3]>=0.18.0",
    "xarray>=2024.1.0",
    "netCDF4>=1.6.0",
]
[tool.poetry]
packages = [
    { include = "unfiltered_radiances" }
]
[tool.setuptools.packages.find]
# Only treat 'tp7' and 'prod' as importable packages
include = ["tp7*", "srfs*", "matt_code*"]
# Explicitly ignore non-code directories to satisfy setuptools
exclude = ["data*", "notebooks*", "imgs*", "prod*"]
[build-system]
requires = ["poetry-core>=2.0.1"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring real data files (deselect with '-m \"not integration\"')",
]