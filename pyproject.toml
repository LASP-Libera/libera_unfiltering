[tool.poetry]
package-mode = false

[project]
name = "unfiltered-radiances"
version = "0.0.1"
description = "Libera Unfiltered Radiance Product"

authors = [
    { name = "Caleb" }
]
requires-python = ">=3.11,<4"

dependencies = [
    "libera-utils>=5.5.1,<6.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "matplotlib>=3.10.1",
]

[build-system]
requires = ["poetry-core>=2.0.1"]
build-backend = "poetry.core.masonry.api"